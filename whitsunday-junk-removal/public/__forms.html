<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Forms</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!-- Netlify Forms skeleton: used by the quote form until Supabase is connected. -->
    <form name="quote" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="quote" />
      <input type="hidden" name="subject" value="New quote request from the website" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="suburb" />
      <input type="text" name="load_size_guess" />
      <input type="date" name="preferred_date" />
      <textarea name="message"></textarea>
      <input type="file" name="photo1" />
      <input type="file" name="photo2" />
      <input type="file" name="photo3" />
      <input type="file" name="photo4" />
      <input type="file" name="photo5" />
    </form>
  </body>
</html>
